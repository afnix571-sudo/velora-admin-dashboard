const g=i=>$('#'+i,o).value.trim(),name=g('f1'),sku=g('f2'),pr=+g('f4'),sl=+g('f5')||0,st=+g('f6');

const d={name,sku,cat:g('f3'),price:pr,sale:sl,stock:st,status:g('f7'),sizes:g('f8'),colors:g('f9'),desc:g('fa'),feat:$('#fb',o).checked?1:0,img:$('#fp',o).dataset.v||x.img};

addC:()=>modal('Generate coupon',`<div class="f"><label>Code<input id="c1" value="VEL${Math.random().toString(36).slice(2,6).toUpperCase()}"></label><label>Discount %<input id="c2" type="number" value="10" min="1" max="90"></label><label class="w">Expiry date<input id="c3" type="date" value="2027-03-31"></label></div>`,o=>{const code=$('#c1',o).value.trim().toUpperCase(),p=+$('#c2',o).value,e=$('#c3',o).value;if(!/^[A-Z0-9]{4,12}$/.test(code))return'Code: 4–12 letters or digits.';if(!(p>=1&&p<=90))return'Discount must be 1–90%.';if(!e)return'Choose an expiry date.';if(db.coupons.some(c=>c.code===code))return'Code already exists.';db.coupons.unshift({code,pct:p,exp:e,on:1,used:0});log('Coupon '+code+' created');save();toast('Coupon created');go2('coupons');return true}),

addCamp:()=>modal('New campaign',`<div class="f"><label class="w">Campaign name<input id="n1"></label></div>`,o=>{const n=$('#n1',o).value.trim();if(!n)return'Name is required.';db.campaigns.unshift({n,reach:0,ctr:0,rev:0});log('Campaign '+n+' created');save();toast('Campaign created');rr();return true}),
addCat:()=>modal('New category',`<div class="f"><label class="w">Name<input id="n1"></label></div>`,o=>{const n=$('#n1',o).value.trim();if(!n)return'Name is required.';if(db.cats.includes(n))return'Category exists.';db.cats.push(n);log('Category '+n+' added');save();toast('Category added');rr();return true}),
delCat:id=>confirmBox('Remove category <b>'+esc(id)+'</b>?',()=>{db.cats=db.cats.filter(c=>c!==id);save();toast('Category removed');rr()}),
saveCms:()=>{Object.assign(db.cms,{hero:$('#m1').value,sub:$('#m2').value,ann:$('#m3').value,feat:$('#m4').value,na:$('#m5').checked?1:0,bs:$('#m6').checked?1:0});log('Website CMS updated');save();toast('CMS saved')},
saveSet:()=>{const n=$('#s1').value.trim();if(!n)return toast('Store name is required');Object.assign(db.set,{name:n,email:$('#s2').value,n1:+$('#n1').checked,n2:+$('#n2').checked,n3:+$('#n3').checked});log('Settings updated');save();toast('Settings saved');rr()},

csv:()=>{const s=REV.slice(-db.range),t='Month,Revenue_PKR,Est_Expenses_PKR\n'+s.map((r,i)=>MON.slice(-db.range)[i]+','+r+','+Math.round(r*.56)).join('\n');modal('Demo report (CSV)',`<textarea style="width:100%;height:180px" readonly>${t}</textarea>`,()=>{navigator.clipboard?.writeText(t).then(()=>toast('Copied to clipboard'),()=>toast('Select the text and copy'));return true},'Copy')},
reset:()=>confirmBox('Reset all demo data to its original state?',()=>{try{localStorage.removeItem(K)}catch(e){}db=seed();toast('Demo data reset');rr()})};

$$('button',r).forEach((b,i)=>b.onclick=()=>{ui[h[i][0]]={q:h[i][3]};r.classList.remove('open');e.target.value='';go2(h[i][0])})};
